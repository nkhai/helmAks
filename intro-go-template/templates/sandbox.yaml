# This is a sandbox template file for testing Helm Go templating features
# Purpose: Demonstrate how to use .Values in Helm templates
# Author: vkn1hc
# Date: October 18, 2025
#
# This template shows how to reference values from the values.yaml file
# using Go template syntax: {{ .Values.variableName }}
#
# Helm Template Functions Used:
# - .Chart.Name: Returns the chart name from Chart.yaml
# - .Release.Name: Returns the release name specified during helm install
# - .Chart.AppVersion: Returns the application version from Chart.yaml
# - .Release.Service: Returns the service that is conducting the release (usually "Helm")
# - .Chart.Version: Returns the chart version from Chart.yaml
# - .Values.test: Returns the value from values.yaml
# - lower: Converts string to lowercase (direct function call)

apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}          # Function: .Chart.Name
    app.kubernetes.io/instance: {{ .Release.Name }}    # Function: .Release.Name
    app.kubernetes.io/version: {{ .Chart.AppVersion }} # Function: .Chart.AppVersion
    app.kubernetes.io/managed-by: {{ .Release.Service }} # Function: .Release.Service
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }} # Functions: .Chart.Name, .Chart.Version
data:
  test: {{ (replace "khai" "new-value" .Values.test) | lower }}                       # Function: lower .Values.test