# Default values for nginx chart
# This file contains templating variables for Helm

# Image configuration
image:
  repository: nginx
  tag: "1.27.0"
  pullPolicy: IfNotPresent

# Pod configuration
replicaCount: 2

# Container ports configuration
containerPorts:
  http: 80

# Service configuration
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 80

# Labels
labels:
  app: nginx
  version: "1.25.3"

# Resource limits (optional)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Node selector (optional)
nodeSelector: {}

# Tolerations (optional)
tolerations: []

# Affinity (optional)
affinity: {}